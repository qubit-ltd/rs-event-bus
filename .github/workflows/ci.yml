name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  large-timeout-macos:
    name: Large timeout tests (macos-14)
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Run large-timeout integration tests
        run: cargo +1.94.0 test --locked --test large_timeout_tests
      - name: Run large-timeout wait-entry tests
        run: cargo +1.94.0 test --locked --lib large_timeout

  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    # Pin the upstream workflow version; review its input contract before upgrading.
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@22e34b76a52b6a9c5c09ddf3fa1fa58b07c46f06
    with:
      verify-extra-script: |
        python3 scripts/check_documentation_examples.py --check-snapshot-content --fetch-snapshot
        python3 scripts/test_documentation_examples.py
        cargo +1.94.0 run --locked --example local_delivery
        cargo +1.94.0 test --locked --manifest-path tests/fixtures/documentation_consumer/Cargo.toml
        cargo +1.94.0 test --locked --no-run --features conformance --test conformance_watchdog_tests
        test_binary=$(find target/debug/deps -maxdepth 1 -type f -name 'conformance_watchdog_tests-*' -perm -u+x | head -n 1)
        test -n "$test_binary"
        python3 scripts/run_conformance_watchdog.py --timeout-seconds 30 --label conformance-watchdog -- "$test_binary" --exact test_external_watchdog_bounds_all_runner_stuck_modes_and_observes_entry --nocapture --test-threads=1
        cargo +1.94.0 test --locked --features conformance --test spi_conformance_tests
        cargo +1.94.0 run --locked --manifest-path tests/fixtures/documentation_consumer/Cargo.toml --bin async_local
        cargo +1.94.0 run --locked --manifest-path tests/fixtures/discovery_consumer/Cargo.toml

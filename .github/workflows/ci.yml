name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  large-timeout-macos:
    name: Large timeout tests (macos-15)
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Check centralized infrastructure snapshot
        run: ./update-infra.sh --check
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0
          components: rust-src
      - name: Prepare local path dependencies
        run: ./.infra/bin/prepare-local-path-dependencies.sh
      - name: Record Rust compiler version
        run: rustc +1.94.0 -Vv
      - name: Run large-timeout integration tests
        run: cargo +1.94.0 test --locked --test large_timeout_tests
      - name: Run large-timeout wait-entry tests
        run: cargo +1.94.0 test --locked --lib large_timeout

  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    # Follow the shared CI workflow on the upstream main branch.
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@main
    with:
      verify-extra-script: |
        python3 scripts/check_documentation_examples.py --check-snapshot-content --fetch-snapshot
        python3 scripts/test_documentation_examples.py
        cargo +1.94.0 run --locked --example local_delivery
        cargo +1.94.0 test --locked --manifest-path tests/fixtures/documentation_consumer/Cargo.toml
        cargo_json=$(mktemp)
        trap 'rm -f "$cargo_json"' EXIT
        cargo +1.94.0 test --locked --no-run --message-format=json --features conformance --test conformance_watchdog_tests > "$cargo_json"
        test_binary=$(python3 scripts/cargo_test_executable.py conformance_watchdog_tests < "$cargo_json")
        test_name=test_external_watchdog_bounds_all_runner_stuck_modes_and_observes_entry
        test_list=$(python3 scripts/run_conformance_watchdog.py --timeout-seconds 30 --label conformance-watchdog-list -- "$test_binary" --list --exact "$test_name")
        printf '%s\n' "$test_list"
        test "$(printf '%s\n' "$test_list" | grep -Fxc "$test_name: test")" -eq 1
        python3 scripts/run_conformance_watchdog.py --timeout-seconds 30 --label conformance-watchdog -- "$test_binary" --exact "$test_name" --nocapture --test-threads=1
        cargo +1.94.0 test --locked --features conformance --test spi_conformance_tests
        cargo +1.94.0 run --locked --manifest-path tests/fixtures/documentation_consumer/Cargo.toml --bin async_local
        cargo +1.94.0 run --locked --manifest-path tests/fixtures/discovery_consumer/Cargo.toml
        examples_json=$(mktemp)
        trap 'rm -f "$cargo_json" "$examples_json"' EXIT
        cargo +1.94.0 build --locked --message-format=json --manifest-path examples/operation_lifecycle/Cargo.toml --example async_shutdown --example notification_close > "$examples_json"
        async_shutdown_binary=$(python3 scripts/cargo_test_executable.py async_shutdown --kind example < "$examples_json")
        notification_close_binary=$(python3 scripts/cargo_test_executable.py notification_close --kind example < "$examples_json")
        test -x "$async_shutdown_binary"
        python3 scripts/run_conformance_watchdog.py --timeout-seconds 30 --label async-shutdown-example -- "$async_shutdown_binary"
        test -x "$notification_close_binary"
        python3 scripts/run_conformance_watchdog.py --timeout-seconds 30 --label notification-close-example -- "$notification_close_binary"

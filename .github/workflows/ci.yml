name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust-ci:
    permissions:
      contents: read
      pull-requests: write
      pages: write
      id-token: write
    # Pin the upstream workflow version; review its input contract before upgrading.
    uses: qubit-ltd/rs-infra-ci/.github/workflows/github-ci.yml@22e34b76a52b6a9c5c09ddf3fa1fa58b07c46f06
    with:
      verify-extra-script: |
        python3 scripts/check_documentation_examples.py --check-snapshot-content --fetch-snapshot
        python3 scripts/test_documentation_examples.py
        cargo +1.94.0 run --locked --example local_delivery
        cargo +1.94.0 test --locked --manifest-path tests/fixtures/documentation_consumer/Cargo.toml
        cargo +1.94.0 run --locked --manifest-path tests/fixtures/documentation_consumer/Cargo.toml --bin async_local
        cargo +1.94.0 run --locked --manifest-path tests/fixtures/discovery_consumer/Cargo.toml

  downstream-compatibility:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_DIR: ${{ runner.temp }}/rs-event-bus-downstream-target
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          path: downstream-ecosystem/rs-event-bus
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.94.0

      - name: Prepare pinned downstream dependency layout
        working-directory: downstream-ecosystem/rs-event-bus
        env:
          ECOSYSTEM_ROOT: ${{ github.workspace }}/downstream-ecosystem
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess

          root = Path(os.environ["ECOSYSTEM_ROOT"])
          manifest = Path("scripts/downstream-compatibility.json")
          repositories = json.loads(manifest.read_text(encoding="utf-8"))["repositories"]
          for repository in repositories:
              destination = root / repository["name"]
              subprocess.run(["git", "init", str(destination)], check=True,
                             stdout=subprocess.DEVNULL)
              subprocess.run(["git", "-C", str(destination), "remote", "add", "origin",
                              repository["url"]], check=True)
              subprocess.run(["git", "-C", str(destination), "fetch", "--no-tags", "--depth", "1",
                              "origin", repository["revision"]], check=True)
              subprocess.run(["git", "-C", str(destination), "checkout", "--detach", "FETCH_HEAD"],
                             check=True, stdout=subprocess.DEVNULL)
              actual = subprocess.run(["git", "-C", str(destination), "rev-parse", "HEAD"],
                                      check=True, capture_output=True, text=True).stdout.strip()
              if actual != repository["revision"]:
                  raise SystemExit(f"{repository['name']}: checked out {actual}, expected {repository['revision']}")
          PY

      - name: Check real downstream compatibility
        working-directory: downstream-ecosystem/rs-event-bus
        run: python3 -B scripts/check_downstream_compatibility.py --ecosystem-root "${{ github.workspace }}/downstream-ecosystem"

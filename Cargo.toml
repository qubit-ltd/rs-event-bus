[package]
name = "qubit-event-bus"
version = "0.8.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-event-bus"
description = "A lightweight, thread-safe in-process event bus for Rust"
homepage = "https://github.com/qubit-ltd/rs-event-bus"
documentation = "https://docs.rs/qubit-event-bus"
readme = "README.md"
keywords = ["event-bus", "pubsub", "events", "thread-safe", "qubit"]
categories = ["concurrency", "asynchronous"]
include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/RUST_CODING_STYLE.md",
    "/RUST_CODING_STYLE.zh_CN.md",
    "/doc/**/user_guide*.md",
    "/examples/**",
    "/resources/**",
    "/src/**",
    "/tests/**",
]

[lib]
name = "qubit_event_bus"
doctest = true

[dependencies]
qubit-argument = { path = "../rs-argument", version = "0.4" }
qubit-executor = { path = "../rs-executor", version = "0.7.1" }
qubit-metadata = { path = "../rs-metadata", version = "0.9", default-features = false }
qubit-retry = { path = "../rs-retry", version = "0.16" }
qubit-thread-pool = { path = "../rs-thread-pool", version = "0.9" }

[patch.crates-io]
qubit-cas = { path = "../rs-cas" }
qubit-state-machine = { path = "../rs-state-machine" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

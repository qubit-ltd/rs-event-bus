[package]
name = "qubit-event-bus"
version = "0.21.0"
edition = "2024"
rust-version = "1.94"
authors = ["Haixing Hu <starfish.hu@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/qubit-ltd/rs-event-bus"
description = "Typed synchronous and asynchronous event bus facades with pluggable providers"
homepage = "https://github.com/qubit-ltd/rs-event-bus"
documentation = "https://docs.rs/qubit-event-bus"
readme = "README.md"
keywords = ["event-bus", "pubsub", "events", "thread-safe", "qubit"]
categories = ["concurrency", "asynchronous"]

include = [
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
    "/README.zh_CN.md",
    "/doc/**/*.md",
    "/examples/**",
    "/src/**",
    "/tests/**",
    "/benches/**",
    "!/doc/ordering_performance_artifacts/**",
    "/doc/ordering_performance_artifacts/README.md",
    "/doc/ordering_performance_artifacts/eb-20261104-review-measurements.md",
]

[package.metadata.rs-infra-dependency]
# The archived benchmark manifests are reconstruction inputs, not active nested packages.
exclude-projects = ["doc/capacity_performance_artifacts/20261104-review"]

[lib]
name = "qubit_event_bus"
doctest = true

[features]
default = []
discovery = ["qubit-spi/inventory"]
conformance = []

[dependencies]
thiserror = "^2.0"
qubit-clock = "^0.13"
qubit-id = { version = "^0.7", features = ["uuid"] }
qubit-retry = { version = "^0.26", features = ["worker", "async"] }
qubit-spi = "^0.14"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(loom)'] }

[dev-dependencies]
loom = "^0.7"

[[bench]]
name = "local_scale"
harness = false

[[bench]]
name = "local_threads"
harness = false

[[bench]]
name = "async_receive_waiter"
harness = false

[[bench]]
name = "retry_saturation"
harness = false

[[bench]]
name = "encoded_publish"
harness = false

[[bench]]
name = "facade_delivery"
harness = false

[[bench]]
name = "facade_signal_registration"
harness = false

[[bench]]
name = "subscriber_middleware"
harness = false

[[bench]]
name = "ordering_keys"
harness = false

[[test]]
name = "model_tests"
path = "tests/model/mod.rs"

[[test]]
name = "error_tests"
path = "tests/error/mod.rs"

[[test]]
name = "local_threads_batch_tests"
path = "benches/local_threads_support/sample_batch_tests.rs"

[workspace]
